[project]
name = "home-work"
version = "0.1.0"
description = ""
authors = [
    {name = "Nastya"}
]
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "isort (>=8.0.0,<9.0.0)"
]

[tool.black]
line-length = 119
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
  venv|
  .venv|
  env|
  .git|
  .hg|
  .mypy_cache|
  .tox|
  .venv|
  .git|
  __pycache__|
  dist|
  build
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
