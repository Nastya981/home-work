[mypy]
python_version = 3.9
warn_return_any = False
warn_unused_configs = False
ignore_missing_imports = True
allow_untyped_calls = True
allow_untyped_decorators = True
allow_untyped_defs = True
no_implicit_optional = False

[mypy-requests.*]
ignore_missing_imports = True

[mypy-src.logger_config]
ignore_missing_imports = True
